services:
  - type: web
    name: wedding-invitation-backend
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: ADMIN_EMAILS
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: EMAIL_FROM
        value: ""
      - key: SEND_USER_CONFIRMATION
        value: "true"
